[project]
name = "qpsq"
version = "0.1.0"
description = "Reimplementation and extension of Wadhwa & Doosti, 'Learning Quantum Processes with Quantum Statistical Queries' (QIC Final Project)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "QIC Final Project Group" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qpsq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
